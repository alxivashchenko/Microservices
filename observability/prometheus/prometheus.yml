global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # (опционально) мониторинг самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'auth-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "auth-service:8081" ]

  - job_name: 'user-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "user-service:8083" ]

  - job_name: 'todo-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "todo-service:8082" ]

  - job_name: 'gateway-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "gateway-service:8084" ]