services:

  postgres:
    image: postgres:16
    container_name: postgres-todo
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env.postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - todo-network

  todo-service:
    build:
      context: .
      dockerfile: todo-service/Dockerfile
    container_name: todo-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8084"
    env_file:
      - .env.todo
    networks:
      - todo-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8084"
    env_file:
      - .env.auth
    networks:
      - todo-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8084"
    env_file:
      - .env.user
    networks:
      - todo-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    restart: always
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      todo-service:
        condition: service_started
    ports:
      - "8084:8084"
    env_file:
      - .env.gateway
    networks:
      - todo-network

  todo-frontend:
    build: ./todo-frontend
    container_name: todo-frontend
    ports:
      - "3000:80"
    networks:
      - todo-network

volumes:
  pgdata:

networks:
  todo-network: